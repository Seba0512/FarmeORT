services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: always
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en el archivo .env}"
      MSSQL_PID: "Express"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
